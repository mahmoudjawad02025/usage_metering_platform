server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    default_type text/plain;
    return 200 'ok';
  }

  # Same-origin proxy to the metering service: no CORS needed.
  location /svc/ {
    proxy_pass http://service:3000/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
